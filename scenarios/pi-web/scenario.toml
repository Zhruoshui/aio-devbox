id = "pi-web"
name = "pi Web UI"
description = "pi 的本地浏览器 UI(@agegr/pi-web,npm 全局装 /usr/local/bin;需 node>=22.19;app entrypoint 自启 30141,面板按钮 iframe 内嵌,app 直接发布端口)"
category = "app"
# S1(2026-09-10,父任务 D1):由 always_on 改为可选场景——mgr 创建向导的
# 服务开关「pi Web」就是本场景的 UI 升格(默认开),关闭则不烘。app entrypoint
# 本就按 `command -v pi-web` 守卫自动拉起(0.0.0.0:30141),未装时静默跳过,
# 面板 iframe 探活失败自动隐藏。仓库自身 .aio/enabled.toml 显式列出,主栈不变。
always_on = false
