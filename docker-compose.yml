services:
  gateway:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway/entrypoint.sh:/entrypoint.sh:ro
      - ./gateway/secrets/hash:/run/secrets/hash:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - app
    networks:
      - sandbox-net

  app:
    build:
      # Repo-root context so app/Dockerfile can reach both app/ (Rust) and web/
      # (React SPA). See app/Dockerfile's web-builder stage.
      context: .
      dockerfile: app/Dockerfile
    image: sandbox-app
    restart: unless-stopped
    expose:
      - "8088"
    # pi-web (autostarted by app/entrypoint.sh on the shared netns) is embedded
    # as an iframe pane and must be reachable from the HOST browser, so unlike
    # 8088 (which goes through the gateway) its port is published directly.
    # A gateway subpath is impossible for pi-web: Next.js emits root-absolute
    # asset URLs (/_next/...) and serves its own /api/* (collides with axum's
    # /api), so it needs a dedicated origin root - see services.toml's piWeb
    # entry. Host-side, this port needs the usual one-time
    # `sbx ports <sandbox> --publish <port>:<port>/tcp` — BOTH sides equal
    # PI_WEB_HOST_PORT (compose binds it in the sandbox), NOT 30141.
    #
    # The HOST-side publish port is configurable (issue #3): when the host
    # republishes 30141 as something else (an `sbx` sandbox with
    # `sbx ports --publish 30142:30142` + PI_WEB_HOST_PORT=30142, or
    # multi-instance deployments), the iframe URL must point at the host
    # port, not the in-container one.
    # PI_WEB_HOST_PORT feeds the {env:PI_WEB_HOST_PORT:30141} placeholder in
    # services.toml's piWeb url (expanded once at app startup); the same
    # variable drives the ports mapping, so the sandbox-side bind and the
    # rendered URL always agree. Set it via .env (compose interpolation) or
    # the shell:
    #   PI_WEB_HOST_PORT=30142 make up
    environment:
      PI_WEB_HOST_PORT: ${PI_WEB_HOST_PORT:-30141}
    ports:
      - "${PI_WEB_HOST_PORT:-30141}:30141"
    volumes:
      - workspace:/root
    networks:
      - sandbox-net

  # code-server (VSCode in the browser). Gated behind the `code-server` profile
  # so it only starts with `docker compose --profile code-server ... up` (or
  # `make up PROFILES=code-server`). Shares app's network namespace
  # (network_mode: service:app): loopback + port space are app's, so the
  # per-service DNS name `code-server` no longer exists on sandbox-net -
  # everything on the shared stack is reached as app:PORT. The manifest
  # auto-detects it via TCP reachability to app:8200 (config.rs), so the UI
  # hides the pane when this container is absent (R8 / AC4). Mounts the shared
  # workspace volume so edits/extensions persist (R6 / AC3). Runs as root from
  # sandbox-base. Note: network_mode is mutually exclusive with
  # networks/expose/ports (removed accordingly); compose adds an implicit
  # depends_on on app - always operate via compose (make restart / make up),
  # never `docker restart aio-app-1` or `--force-recreate app` alone (docker
  # rebuilds the netns on restart; a lone sidecar keeps pointing at the dead
  # one. Recovery = restart the sidecars. Verified 08-24).
  code-server:
    build:
      context: .
      dockerfile: code-server/Dockerfile
    image: sandbox-code-server
    restart: unless-stopped
    profiles:
      - code-server
    network_mode: "service:app"
    environment:
      # code-server's own port preview. Since code-server shares app's netns,
      # /proxy/{port} reaches dev servers started in EITHER the workbench or
      # code-server terminals via the shared loopback - the old "cross-container
      # preview is out of scope" limitation no longer applies. Behind the
      # /code-server/ subpath this absolute path routes to the gateway root,
      # not code-server; kept per design §6.
      VSCODE_PROXY_URI: "/proxy/{port}/"
    volumes:
      - workspace:/root

  # VNC / Chromium container (Phase G). Gated behind the `vnc` profile so it
  # only starts with `docker compose --profile vnc ... up` (or
  # `make up PROFILES=vnc`). Shares app's network namespace
  # (network_mode: service:app): loopback + port space are app's, so the
  # per-service DNS name `vnc` no longer exists on sandbox-net - websockify is
  # reached as app:6080. The manifest auto-detects it via TCP reachability to
  # app:6080 (config.rs), so the UI hides the pane when this container is
  # absent (R8 / AC4). Chromium's localhost == the workbench / code-server
  # terminals' localhost, so dev servers are previewed at
  # http://localhost:PORT with zero cross-container hops (HTTPS-first exempt
  # on loopback). Mounts the shared workspace volume so the Chromium profile
  # persists at /root/.config/chromium (R6 / AC3). Runs as root (same as every
  # container on the volume)
  # - decoupled from sandbox-base: vnc/Dockerfile is FROM
  # debian:bookworm-slim (vnc is a pure browser surface and does not need the
  # dev tooling / scenario fragments). shm_size 2gb because Chromium needs
  # shared memory. tmpfs on /tmp: a stale /tmp/.X99-lock surviving container
  # restarts made Xvnc exit with "Server is already active" and the container
  # flap; tmpfs is wiped on stop, killing the stale lock (R5).
  vnc:
    build:
      context: .
      dockerfile: vnc/Dockerfile
    image: sandbox-vnc
    restart: unless-stopped
    profiles:
      - vnc
    network_mode: "service:app"
    volumes:
      - workspace:/root
    shm_size: "2gb"
    tmpfs:
      - /tmp

  # Base image build, gated behind the `build` profile so it never starts as a
  # runtime container. `docker compose --profile build build base` tags
  # `sandbox-base`, which `app/Dockerfile` (FROM sandbox-base) depends on.
  # The canonical path is `make build` / `make up` (builds sandbox-base first).
  base:
    image: sandbox-base
    build:
      context: .
      dockerfile: Dockerfile.base
    profiles:
      - build

volumes:
  workspace:

networks:
  sandbox-net:
