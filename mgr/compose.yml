# sandbox-mgr control-plane stack (sandbox-mgr Phase 2, design §3.2).
#
# Independent compose project `aio-mgr` (start with `make mgr-up` from the
# repo root, which passes -p and this file's path). Runs alongside the
# existing sandbox stack(s) - it is a pure addition, never touching them.
#
# PATH IDENTITY IS LOAD-BEARING (DooD trap): mgr-api runs `docker compose`
# and `docker build` as subprocesses against the HOST daemon via the mounted
# socket. The sandbox compose files it drives use RELATIVE bind mounts
# (./gateway/Caddyfile), which the compose CLI resolves against ITS OWN
# filesystem before handing absolute paths to the daemon - which resolves
# them against the HOST's filesystem. If mgr-data were mounted at a
# container-local path (/mgr-data), the two sides would disagree and every
# sandbox bind mount would silently become an empty host directory. Mounting
# repo + mgr-data at their OWN host absolute paths (via ${PWD}, set by `make
# mgr-up` from the repo root) makes both sides identical. The same applies
# to MGR_REPO: build contexts ship over the socket, but the gen layer reads
# scenarios/ through this mount, and the paths it records must be
# daemon-visible for any compose file referencing them.
#
# Dual form (prd D3): this stack is the CONTAINERIZED form. The bare-metal
# form (`cargo run -p aio-mgr` on the host) uses the same code with
# MGR_REPO=. MGR_DATA=mgr-data and a host caddy for reloads - see
# mgr/src/caddy.rs's reload channel notes.

services:
  # Total gateway: routes *.mgr.localhost by Host header (caddy:2, no
  # basicauth - D9: the mgr trust boundary is the host machine). The
  # Caddyfile is GENERATED by mgr-api (mgr/src/caddy.rs) from the sandboxes
  # table and reloaded in-place after every create/delete - read-only mount
  # is fine because `caddy reload` only reads the config.
  mgr-gateway:
    image: caddy:2
    restart: unless-stopped
    container_name: aio-mgr-gateway-1
    ports:
      - "80:80"
    volumes:
      - ${PWD:?run from repo root}/mgr-data/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      mgr-net:
      # Shared external network: this is what lets the gateway reach sandbox
      # containers by their aio-mgr-net aliases (sbx-<name>,
      # sbx-<name>-piweb) - design §1. Created idempotently by mgr-api at
      # boot (docker::ensure_network); `make mgr-up` pre-creates it too so
      # this compose doesn't race the API on first start.
      aio-mgr-net: {}

  # Control plane: axum API + compose/image/jobs (Phase 1) + total-gateway
  # generation (Phase 2). Mounts the host docker socket (CLI over socket,
  # D2/D3), the repo root read-only (scenario catalog, Dockerfile parts,
  # build context), and mgr-data read-write (SQLite + generated Caddyfile +
  # per-sandbox instances/) - repo and mgr-data at their OWN host paths (see
  # the PATH IDENTITY note above). MGR_GATEWAY_CONTAINER selects the
  # containerized reload channel (docker exec into the gateway service).
  mgr-api:
    build:
      context: ..
      dockerfile: mgr/Dockerfile
    image: aio-mgr
    restart: unless-stopped
    environment:
      MGR_REPO: ${PWD:?}
      MGR_DATA: ${PWD:?}/mgr-data
      MGR_BIND: 0.0.0.0:8089
      MGR_GATEWAY_CONTAINER: aio-mgr-gateway-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD:?}:${PWD:?}:ro
      - ${PWD:?}/mgr-data:${PWD:?}/mgr-data
    networks:
      mgr-net:
      # alias `mgr-api` is reserved for Phase 4 (MGR_URL pull sync from the
      # sandbox apps, design §3.7); the total gateway already uses the same
      # name for the mgr.localhost site block (mgr/src/caddy.rs render).
      aio-mgr-net:
        aliases:
          - mgr-api

  # Phase 3 (mgr-web, the Vite management SPA) needs NO service of its own:
  # mgr/Dockerfile's web-builder stage bakes mgr-web/dist into the mgr-api
  # image at /app/static and the axum process serves it (main.rs MGR_WEB_DIR
  # default). The total gateway routes http://mgr.localhost -> mgr-api:8089,
  # so the UI, the API and the sandboxes all sit behind the one :80 entry.

networks:
  mgr-net:
  aio-mgr-net:
    external: true
    name: aio-mgr-net
