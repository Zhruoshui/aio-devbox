[package]
name = "aio-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aio-app"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tower-http = { version = "0.5", features = ["fs"] }
# Phase E: terminal pty bridge. portable-pty spawns a login shell in a pty;
# futures-util drives the split WebSocket sink/stream.
portable-pty = "0.8"
futures-util = "0.3"
# Stats endpoint: statvfs on the workspace volume for disk usage.
nix = { version = "0.29", features = ["fs"] }
# Model config: HTTP client for /v1/models discovery + availability test.
# default-features off to avoid pulling openssl; rustls-tls for clean linking.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Model config: read-only access to opencode's SQLite session DB (usage stats).
rusqlite = { version = "0.32", features = ["bundled"] }
# Model config: parse opencode.jsonc (JSON with comments) for the renderer.
json5 = "0.4"

[profile.release]
opt-level = 2
