# Service registry for the AIO sandbox workspace UI.
#
# Built-in buttons. The axum app parses this at build time (include_str!) and
# exposes it via GET /api/manifest; the React frontend renders one button per
# entry by `type`. User-registered buttons live separately in
# /root/.aio/buttons.toml (written via POST/DELETE /api/buttons).
#
# Adding a built-in service = add an entry here (+ container/profile/caddy route
# for type=web) and rebuild the app image. See design.md §14.
#
# Fields:
#   id     - button identifier (frontend key; stable for toggle state)
#   type   - "web" (iframe pane, containerized) | "agent" (xterm pane, pty-launched CLI)
#          | "page" (native React pane provided by the app itself; always enabled)
#   target - host:port to TCP-probe for liveness (type=web only). `enabled` in the
#            manifest = whether this is currently reachable (reflects compose profiles).
#   url    - iframe src (type=web only). Usually a gateway path (/code-server/);
#            may be absolute with a `{host}` placeholder (IframePane substitutes
#            window.location.hostname) for services that publish their own port
#            and cannot sit behind a subpath - see the piWeb entry.
#   label  - display name (optional; falls back to a friendly form of `id`)
#   cmd    - command launched in the pty (type=agent only). "" = default shell.
#            `enabled` for type=agent = command_exists(cmd) on the login-shell
#            PATH, so a button only shows when the tool is actually installed
#            (replaces the old ENABLE_* env that produced dead panes).

[[service]]
id = "codeServer"
type = "web"
target = "app:8200"
url = "/code-server/"
label = "code-server"

[[service]]
id = "vnc"
type = "web"
target = "app:6080"
label = "Chromium"
# `path=vnc/websockify` is REQUIRED: noVNC's ui.js builds the WS URL as
# `ws://<host>:<port>/<path>` (absolute, it does NOT keep the /vnc/ subpath the
# page was served from). With the default `path=websockify` it connects to
# `ws://host/websockify`, which caddy's catch-all forwards to axum -> 404.
# `vnc/websockify` makes it `ws://host/vnc/websockify`, which caddy's
# `handle_path /vnc/*` strips to `/websockify` on app:6080 (websockify's WS;
# endpoint). host/port auto-derive from window.location, so only path needs
# fixing. autoconnect/resize are read from the query string by noVNC too.
url = "/vnc/vnc.html?autoconnect=1&resize=scale&path=vnc/websockify"

[[service]]
id = "terminal"
type = "agent"
cmd = ""                      # empty = default login shell; always present (bash)
label = "Terminal"

[[service]]
id = "opencode"
type = "agent"
cmd = "opencode"              # button shows only if `opencode` is on PATH
label = "opencode"

[[service]]
id = "pi"
type = "agent"
cmd = "pi"                    # button shows only if `pi` is on PATH
label = "pi"

[[service]]
id = "piWeb"
type = "web"
# pi-web embedded in an iframe pane (was type=agent: a pty pane that merely
# STARTED the server). The server is now autostarted at container boot by
# app/entrypoint.sh (respawn loop, logs in ~/.aio/pi-web.log), and this entry
# only points the pane at it - `enabled` TCP-probes app:30141, so the button
# still auto-hides when the pi-web scenario isn't baked (nothing listens).
#
# Why a published-port URL (http://{host}:30141/) instead of a gateway path
# like code-server (/code-server/) or vnc (/vnc/): pi-web is a Next.js app
# whose HTML references ROOT-absolute assets (/_next/static/..., verified by
# curl), so caddy's handle_path strip-prefix pattern breaks - the browser
# would request /_next/... at the gateway root and land on axum (404). It also
# serves its own /api/* (sessions/cwd/worktrees...), colliding with axum's
# /api. Hence a dedicated origin: docker-compose publishes 30141 directly on
# the app service, and pi-web is served at the root of that port.
#
# {host} is substituted with window.location.hostname by IframePane.tsx: the
# browser may reach the sandbox via localhost OR a LAN IP, and the manifest
# URL must stay static. pi-web trusts loopback + IP literals
# (request-security.ts), so both pass its Host check; PI_WEB_ALLOWED_HOSTS=app
# (set by the autostart) keeps http://app:30141 working from sandbox-net.
#
# {env:PI_WEB_HOST_PORT:30141} is expanded ONCE at app startup (config.rs
# expand_placeholders) with the process env; unset/empty => the default 30141
# (= current behavior). The HOST-side published port differs from the in-
# sandbox one when the host republishes; in the sbx scenario both sides of
# the publish must equal PI_WEB_HOST_PORT (e.g. PI_WEB_HOST_PORT=30142 +
# `sbx ports --publish 30142:30142`), so docker-compose passes
# PI_WEB_HOST_PORT through (defaulting to 30141) - see the app service in
# docker-compose.yml and issue #3. `target` stays app:30141: TCP liveness
# probes the sandbox-net-internal port, which the host-side publish never
# changes.
target = "app:30141"
url = "http://{host}:{env:PI_WEB_HOST_PORT:30141}/"
label = "pi Web"

[[service]]
id = "modelsConfig"
type = "page"
label = "模型配置"
