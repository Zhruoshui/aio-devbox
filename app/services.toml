# Service registry for the AIO sandbox workspace UI.
#
# Built-in buttons. The axum app parses this at build time (include_str!) and
# exposes it via GET /api/manifest; the React frontend renders one button per
# entry by `type`. User-registered buttons live separately in
# /home/gem/.aio/buttons.toml (written via POST/DELETE /api/buttons).
#
# Adding a built-in service = add an entry here (+ container/profile/caddy route
# for type=web) and rebuild the app image. See design.md §14.
#
# Fields:
#   id     - button identifier (frontend key; stable for toggle state)
#   type   - "web" (iframe pane, containerized) | "agent" (xterm pane, pty-launched CLI)
#   target - host:port to TCP-probe for liveness (type=web only). `enabled` in the
#            manifest = whether this is currently reachable (reflects compose profiles).
#   url    - gateway path the iframe opens (type=web only)
#   label  - display name (optional; falls back to a friendly form of `id`)
#   cmd    - command launched in the pty (type=agent only). "" = default shell.
#            `enabled` for type=agent = command_exists(cmd) on the login-shell
#            PATH, so a button only shows when the tool is actually installed
#            (replaces the old ENABLE_* env that produced dead panes).

[[service]]
id = "codeServer"
type = "web"
target = "code-server:8200"
url = "/code-server/"
label = "code-server"

[[service]]
id = "vnc"
type = "web"
target = "vnc:6080"
label = "Chromium"
# `path=vnc/websockify` is REQUIRED: noVNC's ui.js builds the WS URL as
# `ws://<host>:<port>/<path>` (absolute, it does NOT keep the /vnc/ subpath the
# page was served from). With the default `path=websockify` it connects to
# `ws://host/websockify`, which caddy's catch-all forwards to axum -> 404.
# `vnc/websockify` makes it `ws://host/vnc/websockify`, which caddy's
# `handle_path /vnc/*` strips to `/websockify` on vnc:6080 (websockify's WS
# endpoint). host/port auto-derive from window.location, so only path needs
# fixing. autoconnect/resize are read from the query string by noVNC too.
url = "/vnc/vnc.html?autoconnect=1&resize=scale&path=vnc/websockify"

[[service]]
id = "terminal"
type = "agent"
cmd = ""                      # empty = default login shell; always present (bash)
label = "Terminal"

[[service]]
id = "opencode"
type = "agent"
cmd = "opencode"              # button shows only if `opencode` is on PATH
label = "opencode"

[[service]]
id = "pi"
type = "agent"
cmd = "pi"                    # button shows only if `pi` is on PATH
label = "pi"

[[service]]
id = "piWeb"
type = "agent"
# Launch the pi-web server in a pty pane. command_exists probes the FIRST
# whitespace token of cmd, so the cmd must start with the real binary
# (`pi-web`) - do NOT inline an env prefix (`VAR=x pi-web ...` would probe for
# a binary named `VAR=x`). The button hides if the pi-web scenario isn't baked.
# --no-open stops it trying to open a browser (headless); 0.0.0.0 lets a
# published host port reach it. PI_WEB_ALLOWED_HOSTS=app is exported by
# /etc/profile.d/pi-web.sh (baked in the pi-web scenario), so pi-web accepts
# the sandbox-net DNS name http://app:30141 from the VNC/Chromium container
# (pi-web only trusts loopback + IP literals otherwise; see request-security.ts).
# Host access via a published port still works (Host = IP literal / localhost);
# VNC needs no host-side port publish - it is already on sandbox-net.
cmd = "pi-web --no-open --hostname 0.0.0.0 --port 30141"
label = "pi Web"
