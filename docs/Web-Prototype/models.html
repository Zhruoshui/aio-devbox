<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>模型配置 · Sandbox 管理器</title>
  <script>document.documentElement.dataset.mode = localStorage.getItem("mgr.theme") === "light" ? "light" : "dark";</script>
  <link rel="stylesheet" href="mgr-web.css" />
  <style>
    .profile-bar { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-5); background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--elev-ring); flex-wrap: wrap; }
    .profile-bar .lbl { font-size: var(--text-sm); font-weight: 500; }
    .profile-bar .hint { font-size: var(--text-xs); color: var(--muted); margin-left: auto; }
    .sec-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-4); }
    .sec-head h2 { font-size: var(--text-lg); }
    .sec-head p { font-size: var(--text-sm); color: var(--muted); margin-top: 2px; max-width: 70ch; }
    .sec-acts { display: flex; gap: var(--space-2); flex-shrink: 0; }
    .pv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-4); }
    .pv { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); text-align: left; cursor: pointer; border: 0; }
    .pv:hover { box-shadow: 0 0 0 1px color-mix(in oklch, var(--fg) 28%, transparent), var(--elev-raised); }
    .pv-head { display: flex; align-items: center; gap: var(--space-2); }
    .pv-head h3 { font-size: var(--text-base); flex: 1; min-width: 0; }
    .pv .url { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pv .models { display: flex; flex-wrap: wrap; gap: 4px; }
    .pv .used { font-size: var(--text-xs); color: var(--muted); display: flex; align-items: center; gap: var(--space-1); margin-top: auto; }
    .pv .used b { color: var(--fg-2); font-weight: 500; }
    .pv.add { align-items: center; justify-content: center; color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); background: transparent; min-height: 150px; }
    .pv.add:hover { color: var(--fg); background: color-mix(in oklch, var(--fg) 3%, transparent); }
    .two { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--space-4); align-items: start; }
    @media (max-width: 1000px) { .two { grid-template-columns: 1fr; } }
    .assign { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
    .assign h3 { font-size: var(--text-base); }
    .model-opt { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); border-radius: var(--radius-lg); box-shadow: var(--elev-ring); cursor: pointer; }
    .model-opt:has(:checked) { box-shadow: 0 0 0 2px var(--fg); }
    .model-opt .id { font-family: var(--font-mono); font-size: var(--text-sm); }
    .model-opt .meta { font-size: var(--text-xs); color: var(--muted); }
    .model-opt .tag { margin-left: auto; }
    .savebar { display: flex; align-items: center; gap: var(--space-2); padding-top: var(--space-3); border-top: 1px solid var(--border-soft); font-size: var(--text-sm); color: var(--muted); }
    .savebar .btn-primary { margin-left: auto; }
    .sbx-tbl td:first-child { font-weight: 500; }
    .sbx-tbl .other { color: var(--muted); }
    .strip { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-4); border-radius: var(--radius-md); background: var(--surface-warm); font-size: var(--text-sm); color: var(--muted); }
    .strip .icon { color: var(--fg); }
    .preset { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
    .preset.current { box-shadow: 0 0 0 1.5px var(--fg), var(--elev-raised); }
    .preset-head { display: flex; align-items: center; gap: var(--space-2); }
    .preset-head h3 { font-size: var(--text-base); flex: 1; }
    .preset .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--space-3); font-size: var(--text-xs); }
    .preset .kv dt { color: var(--muted); }
    .preset .kv dd { margin: 0; font-family: var(--font-mono); }
    .preset-acts { display: flex; gap: 2px; align-items: center; padding-top: var(--space-2); border-top: 1px solid var(--border-soft); margin-top: var(--space-1); }
    .preset-acts .btn-secondary { margin-right: auto; }
    .drawer { position: fixed; inset: 0; z-index: 100; display: none; }
    .drawer.open { display: block; }
    .drawer .scrim { position: absolute; inset: 0; background: oklch(0% 0 0 / 0.4); }
    .drawer .sheet { position: absolute; top: 0; right: 0; bottom: 0; width: 460px; max-width: 100%; background: var(--surface); box-shadow: -1px 0 0 var(--border), -8px 0 32px oklch(0% 0 0 / 0.2); display: flex; flex-direction: column; }
    .drawer .sheet-head { display: flex; align-items: center; gap: var(--space-2); height: 52px; padding: 0 var(--space-3) 0 var(--space-5); border-bottom: 1px solid var(--border-soft); }
    .drawer .sheet-head h2 { font-size: var(--text-lg); flex: 1; }
    .drawer .sheet-body { flex: 1; overflow-y: auto; padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }
    .drawer .sheet-foot { display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-5); border-top: 1px solid var(--border-soft); }
    .drawer .sheet-foot .btn-primary { margin-left: auto; }
    .mtable td input { height: 28px; }
    .mtable .mono { font-size: var(--text-xs); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body data-page="models">
<div class="app">
  <div data-rail></div>
  <main class="main scroll">
    <div class="page">
      <header class="page-head" data-od-id="models-head">
        <div>
          <h1>模型配置</h1>
          <p class="sub">供应商库全局共享；每个 profile 决定四个 agent 各指向哪个供应商与模型；沙箱按「profile + agent 子集」生效，未指派的沙箱保留本地配置。</p>
        </div>
      </header>

      <!-- Profile 选择条（D8） -->
      <div class="profile-bar" data-od-id="profile-bar">
        <span class="lbl">Profile</span>
        <div class="segmented" role="group" aria-label="选择 profile" id="profiles"></div>
        <button class="icon-btn" id="pf-rename" title="重命名当前 profile" aria-label="重命名当前 profile"><svg class="icon sm"><use href="#i-edit"/></svg></button>
        <button class="icon-btn danger" id="pf-del" title="删除当前 profile（至少保留一个）" aria-label="删除当前 profile"><svg class="icon sm"><use href="#i-trash"/></svg></button>
        <button class="btn btn-ghost btn-sm" id="pf-new"><svg class="icon"><use href="#i-plus"/></svg>新建 profile</button>
        <span class="hint" id="pf-hint"></span>
      </div>

      <div class="tabs" role="tablist" id="tabs" data-od-id="models-tabs">
        <button role="tab" aria-selected="true" data-tab="providers">供应商库 <span class="cnt" id="pv-cnt"></span></button>
        <button role="tab" aria-selected="false" data-tab="pi">pi</button>
        <button role="tab" aria-selected="false" data-tab="opencode">opencode</button>
        <button role="tab" aria-selected="false" data-tab="claude">Claude Code</button>
        <button role="tab" aria-selected="false" data-tab="codex">Codex</button>
      </div>

      <section class="tab-panel active" id="tab-providers" data-od-id="tab-providers">
        <div class="sec-head">
          <div><h2>供应商库</h2><p>全局共享，不随 profile 变化。点击卡片编辑地址、密钥与模型列表；agent 只能指向库中已有的模型。</p></div>
          <div class="sec-acts"><button class="btn btn-secondary" title="读取 pi 的 models.json 合并进库">从 pi 导入</button><button class="btn btn-primary" id="pv-add"><svg class="icon"><use href="#i-plus"/></svg>新增供应商</button></div>
        </div>
        <div class="pv-grid" id="pv-grid"></div>
      </section>
      <section class="tab-panel" id="tab-pi" data-od-id="tab-pi"></section>
      <section class="tab-panel" id="tab-opencode" data-od-id="tab-opencode"></section>
      <section class="tab-panel" id="tab-claude" data-od-id="tab-claude"></section>
      <section class="tab-panel" id="tab-codex" data-od-id="tab-codex"></section>
    </div>
  </main>
</div>

<!-- 供应商编辑抽屉（ProviderEditor） -->
<div class="drawer" id="drawer">
  <div class="scrim" id="drawer-scrim"></div>
  <div class="sheet" role="dialog" aria-labelledby="dr-title" data-od-id="provider-drawer">
    <div class="sheet-head"><h2 id="dr-title">编辑供应商</h2><button class="icon-btn" id="dr-close" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button></div>
    <div class="sheet-body">
      <div class="field-row">
        <div class="field"><label for="dr-name">名称</label><input class="input" id="dr-name" /></div>
        <div class="field"><label for="dr-api">协议</label><select class="input" id="dr-api"><option value="anthropic-messages">Anthropic Messages</option><option value="openai-responses">OpenAI Responses</option><option value="openai-completions">OpenAI 兼容（chat/completions）</option></select></div>
      </div>
      <div class="field"><label for="dr-url">Base URL</label><input class="input mono" id="dr-url" /></div>
      <div class="field"><label for="dr-key">API Key</label><div class="input-wrap"><input class="input mono" id="dr-key" type="password" style="padding-left: var(--space-3); padding-right: 40px" /><button class="icon-btn" id="dr-eye" type="button" style="position:absolute;right:4px" aria-label="显示 / 隐藏密钥"><svg class="icon sm"><use href="#i-eye"/></svg></button></div><span class="hint">密钥只存放在 mgr 数据目录，渲染到沙箱 agent 配置时按需注入。</span></div>
      <div>
        <div class="sec-head" style="margin-bottom: var(--space-2)"><h3 class="tsm" style="font-weight:600">模型列表</h3><div class="sec-acts"><button class="btn btn-ghost btn-sm" title="调用 /models 端点发现可用模型">发现模型</button><button class="btn btn-ghost btn-sm" id="dr-addmodel"><svg class="icon"><use href="#i-plus"/></svg>添加</button></div></div>
        <table class="table mtable"><thead><tr><th>模型 ID</th><th>显示名</th><th class="r">输入 $/M</th><th class="r">输出 $/M</th><th></th></tr></thead><tbody id="dr-models"></tbody></table>
      </div>
    </div>
    <div class="sheet-foot"><button class="btn btn-secondary" id="dr-test">测试连接</button><span class="tsm muted" id="dr-test-msg" style="align-self:center"></span><button class="btn btn-primary" id="dr-save">保存</button></div>
  </div>
</div>

<script src="mgr-shell.js"></script>
<script>
(function () {
  const I = window.icon;
  // ── 示例数据（对应 /api/models/config 的 CanonicalConfig + profiles）
  const PROVIDERS = {
    anthropic: { name: "Anthropic", api: "anthropic-messages", baseUrl: "https://api.anthropic.com", key: "sk-ant-api03-…3f9Q", models: [{ id: "claude-sonnet-5", name: "Claude Sonnet 5", cost: [3, 15] }, { id: "claude-opus-5", name: "Claude Opus 5", cost: [15, 75], reasoning: true }] },
    openai: { name: "OpenAI", api: "openai-responses", baseUrl: "https://api.openai.com/v1", key: "sk-proj-…8kLm", models: [{ id: "gpt-5", name: "GPT-5", cost: [1.25, 10], reasoning: true }, { id: "gpt-5-mini", name: "GPT-5 mini", cost: [0.25, 2] }] },
    deepseek: { name: "DeepSeek", api: "openai-completions", baseUrl: "https://api.deepseek.com", key: "sk-…c21a", models: [{ id: "deepseek-chat", name: "DeepSeek V3", cost: [0.27, 1.1] }, { id: "deepseek-reasoner", name: "DeepSeek R1", cost: [0.55, 2.19], reasoning: true }] },
    ollama: { name: "Ollama（本机）", api: "openai-completions", baseUrl: "http://host.docker.internal:11434/v1", key: "", models: [{ id: "qwen3:32b", name: "Qwen3 32B", cost: null }] },
  };
  const SANDBOXES = [
    { name: "dev1", profile: "default", agents: ["pi", "claude", "codex", "opencode"], live: "running" },
    { name: "dev2", profile: "research", agents: ["pi", "opencode"], live: "running" },
    { name: "exp-rust", profile: null, agents: [], live: "stopped" },
    { name: "legacy-stack", profile: "default", agents: ["pi"], live: "running" },
  ];
  const PROFILES = {
    default: { name: "default", pi: { provider: "anthropic", model: "claude-sonnet-5" }, opencode: { provider: "deepseek", model: "deepseek-chat" },
      claude: { current: "p1", presets: [{ id: "p1", name: "Anthropic 官方", provider: "anthropic", model: "claude-sonnet-5", extra: { "Opus 映射": "claude-opus-5", "Haiku 映射": "claude-sonnet-5", "认证字段": "ANTHROPIC_API_KEY" } }, { id: "p2", name: "DeepSeek 兼容", provider: "deepseek", model: "deepseek-chat", extra: { "Opus 映射": "deepseek-reasoner", "认证字段": "ANTHROPIC_AUTH_TOKEN" } }] },
      codex: { current: "c1", presets: [{ id: "c1", name: "OpenAI 官方", provider: "openai", model: "gpt-5", extra: { "推理强度": "medium", "wire API": "responses" } }] } },
    research: { name: "research", pi: { provider: "anthropic", model: "claude-opus-5" }, opencode: { provider: "openai", model: "gpt-5" },
      claude: { current: "p1", presets: [{ id: "p1", name: "Anthropic 官方", provider: "anthropic", model: "claude-opus-5", extra: { "认证字段": "ANTHROPIC_API_KEY" } }] },
      codex: { current: null, presets: [] } },
  };
  const AGENT_LABEL = { pi: "pi", opencode: "opencode", claude: "Claude Code", codex: "Codex" };
  let profileId = "default", tab = "providers"; const dirty = new Set();

  // ── profile 条
  function renderProfiles() {
    const el = document.getElementById("profiles");
    el.innerHTML = Object.values(PROFILES).map((p) => { const n = SANDBOXES.filter((s) => s.profile === p.name).length; return `<button aria-pressed="${p.name === profileId}" data-p="${p.name}">${p.name} <span class="cnt">${n} 个沙箱</span></button>`; }).join("");
    document.getElementById("pf-del").disabled = Object.keys(PROFILES).length <= 1;
    const un = SANDBOXES.filter((s) => !s.profile).map((s) => s.name);
    document.getElementById("pf-hint").textContent = un.length ? `未指派：${un.join("、")}（保留本地配置，可在沙箱列表快速指派）` : "所有沙箱均已指派";
  }
  document.getElementById("profiles").addEventListener("click", (e) => { const b = e.target.closest("[data-p]"); if (!b) return; profileId = b.dataset.p; dirty.clear(); renderProfiles(); renderAgents(); });
  document.getElementById("pf-new").addEventListener("click", () => { const n = prompt("新 profile 名称：", "staging"); if (!n || PROFILES[n]) return; PROFILES[n] = JSON.parse(JSON.stringify(PROFILES[profileId])); PROFILES[n].name = n; profileId = n; renderProfiles(); renderAgents(); });
  document.getElementById("pf-rename").addEventListener("click", () => { const n = prompt("重命名 profile：", profileId); if (!n || PROFILES[n]) return; const p = PROFILES[profileId]; delete PROFILES[profileId]; p.name = n; PROFILES[n] = p; SANDBOXES.forEach((s) => { if (s.profile === profileId) s.profile = n; }); profileId = n; renderProfiles(); renderAgents(); });
  document.getElementById("pf-del").addEventListener("click", () => { if (Object.keys(PROFILES).length <= 1) return; if (!confirm(`删除 profile「${profileId}」？其指派的沙箱将变为未指派（保留本地配置）。`)) return; SANDBOXES.forEach((s) => { if (s.profile === profileId) s.profile = null; }); delete PROFILES[profileId]; profileId = Object.keys(PROFILES)[0]; renderProfiles(); renderAgents(); });

  // ── tabs
  document.getElementById("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (!b) return; tab = b.dataset.tab; document.querySelectorAll("#tabs [role=tab]").forEach((t) => t.setAttribute("aria-selected", String(t === b))); document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("active", p.id === "tab-" + tab)); });

  // ── 供应商库
  function usedBy(pid) { const out = []; Object.values(PROFILES).forEach((p) => { ["pi", "opencode"].forEach((a) => { if (p[a].provider === pid) out.push(`${AGENT_LABEL[a]} (${p.name})`); }); ["claude", "codex"].forEach((a) => { const cur = p[a].presets.find((x) => x.id === p[a].current); if (cur && cur.provider === pid) out.push(`${AGENT_LABEL[a]} (${p.name})`); }); }); return out; }
  function renderProviders() {
    const ids = Object.keys(PROVIDERS);
    document.getElementById("pv-cnt").textContent = ids.length;
    document.getElementById("pv-grid").innerHTML = ids.map((id) => { const p = PROVIDERS[id]; const u = usedBy(id); return `<button class="card pv" data-pv="${id}" aria-label="编辑 ${p.name}">
      <div class="pv-head"><h3>${p.name}</h3><span class="badge badge-neutral">${{ "anthropic-messages": "Anthropic", "openai-responses": "Responses", "openai-completions": "OpenAI 兼容" }[p.api]}</span></div>
      <div class="url">${p.baseUrl}</div>
      <div class="models">${p.models.map((m) => `<span class="chip mono" title="${m.name}">${m.id}</span>`).join("")}</div>
      <div class="used">${p.key ? I("key", "xs") + "<span>已配置密钥</span>" : I("info", "xs") + "<span>无密钥</span>"}<span>·</span>${u.length ? `<span>用于 <b>${u.join("、")}</b></span>` : "<span>未被任何 agent 使用</span>"}</div>
    </button>`; }).join("") + `<button class="card pv add" id="pv-add2">${I("plus")}<span class="tsm">新增供应商</span></button>`;
  }
  document.getElementById("pv-grid").addEventListener("click", (e) => { const b = e.target.closest("[data-pv]"); if (b) openDrawer(b.dataset.pv); if (e.target.closest("#pv-add2")) openDrawer(null); });
  document.getElementById("pv-add").addEventListener("click", () => openDrawer(null));

  // ── 抽屉
  const drawer = document.getElementById("drawer"); let editing = null;
  function openDrawer(id) {
    editing = id; const p = id ? PROVIDERS[id] : { name: "", api: "openai-completions", baseUrl: "", key: "", models: [] };
    document.getElementById("dr-title").textContent = id ? `编辑供应商 · ${p.name}` : "新增供应商";
    document.getElementById("dr-name").value = p.name; document.getElementById("dr-api").value = p.api; document.getElementById("dr-url").value = p.baseUrl; document.getElementById("dr-key").value = p.key; document.getElementById("dr-key").type = "password";
    document.getElementById("dr-test-msg").textContent = "";
    document.getElementById("dr-models").innerHTML = p.models.map((m) => `<tr><td class="mono">${m.id}</td><td>${m.name || ""}</td><td class="r num">${m.cost ? m.cost[0] : "—"}</td><td class="r num">${m.cost ? m.cost[1] : "—"}</td><td><button class="icon-btn danger" aria-label="移除 ${m.id}" onclick="this.closest('tr').remove()">${I("x", "xs")}</button></td></tr>`).join("") || `<tr><td colspan="5" class="muted">尚无模型，点击「发现模型」或「添加」。</td></tr>`;
    drawer.classList.add("open"); document.getElementById("dr-name").focus();
  }
  const closeDrawer = () => drawer.classList.remove("open");
  document.getElementById("dr-close").addEventListener("click", closeDrawer);
  document.getElementById("drawer-scrim").addEventListener("click", closeDrawer);
  document.getElementById("dr-eye").addEventListener("click", () => { const k = document.getElementById("dr-key"); k.type = k.type === "password" ? "text" : "password"; });
  document.getElementById("dr-addmodel").addEventListener("click", () => { document.getElementById("dr-models").insertAdjacentHTML("beforeend", `<tr><td><input class="input sm mono" placeholder="model-id" aria-label="模型 ID" /></td><td><input class="input sm" placeholder="显示名" aria-label="显示名" /></td><td><input class="input sm num" placeholder="0" aria-label="输入价格" style="width:64px;text-align:right" /></td><td><input class="input sm num" placeholder="0" aria-label="输出价格" style="width:64px;text-align:right" /></td><td><button class="icon-btn danger" aria-label="移除" onclick="this.closest('tr').remove()">${I("x", "xs")}</button></td></tr>`); });
  document.getElementById("dr-test").addEventListener("click", (e) => { const m = document.getElementById("dr-test-msg"); m.innerHTML = `<span class="spinner" style="display:inline-block;vertical-align:-2px"></span> 正在请求 /models …`; setTimeout(() => { m.innerHTML = `<span class="sdot" style="display:inline-block"></span> 连接成功`; }, 900); });
  document.getElementById("dr-save").addEventListener("click", () => { const name = document.getElementById("dr-name").value.trim(); if (!name) return; const id = editing || name.toLowerCase().replace(/[^a-z0-9]+/g, "-"); PROVIDERS[id] = { ...(PROVIDERS[id] || { models: [] }), name, api: document.getElementById("dr-api").value, baseUrl: document.getElementById("dr-url").value.trim(), key: document.getElementById("dr-key").value }; closeDrawer(); renderProviders(); renderAgents(); });

  // ── agent tab：pi / opencode（增量指派）与 claude / codex（预设切换）
  function sandboxTable(agent) {
    return `<div class="card assign"><h3>生效沙箱</h3>
      <table class="table sbx-tbl"><thead><tr><th>沙箱</th><th>Profile</th><th>${AGENT_LABEL[agent]}</th><th></th></tr></thead><tbody>
      ${SANDBOXES.map((s) => { const mine = s.profile === profileId; const on = mine && s.agents.includes(agent);
        return `<tr class="${mine ? "" : "other"}"><td>${s.name}</td><td>${s.profile ? `${mine ? `<span class="badge badge-neutral">${s.profile}</span>` : `<span class="muted txs">${s.profile}</span>`}` : `<span class="muted txs">未指派</span>`}</td>
        <td>${mine ? `<label style="display:inline-flex;align-items:center;gap:8px"><input class="switch" type="checkbox" data-sb="${s.name}" data-agent="${agent}" ${on ? "checked" : ""} aria-label="${s.name} 启用 ${AGENT_LABEL[agent]}" /><span class="txs">${on ? "生效" : "保留本地"}</span></label>` : s.profile ? `<span class="muted txs">属于其他 profile</span>` : `<span class="muted txs">—</span>`}</td>
        <td class="r">${s.profile && !mine ? `<button class="btn btn-ghost btn-sm" data-goto="${s.profile}">切到 ${s.profile}</button>` : !s.profile ? `<a class="btn btn-ghost btn-sm" href="sandbox-list.html">去指派</a>` : `<a class="btn btn-ghost btn-sm" href="workspace.html" ${s.live !== "running" ? 'aria-disabled="true" title="沙箱未运行"' : ""}>打开工作区</a>`}</td></tr>`; }).join("")}
      </tbody></table>
      <p class="txs muted" style="margin:0">沙箱内的 agent 每 60 秒拉取一次渲染结果；关闭开关的 agent 保留沙箱本地文件不被覆盖。</p></div>`;
  }
  function modelOptions(agent, sel) {
    return Object.entries(PROVIDERS).flatMap(([pid, p]) => p.models.map((m) => `<label class="model-opt"><input class="radio" type="radio" name="m-${agent}" value="${pid}/${m.id}" ${sel === pid + "/" + m.id ? "checked" : ""} /><div><div class="id">${m.id}</div><div class="meta">${p.name} · ${m.name}${m.cost ? ` · $${m.cost[0]} / $${m.cost[1]} 每百万 token` : " · 本地，无成本"}</div></div>${m.reasoning ? `<span class="chip tag">推理</span>` : ""}</label>`)).join("");
  }
  function renderAgents() {
    const P = PROFILES[profileId];
    ["pi", "opencode"].forEach((a) => {
      const cur = P[a].provider + "/" + P[a].model;
      document.getElementById("tab-" + a).innerHTML = `
        <div class="strip">${I("info", "sm")}<span>增量式 agent：profile「${P.name}」为 ${AGENT_LABEL[a]} 指定唯一的供应商与模型，mgr 把它渲染进沙箱的 ${a === "pi" ? "~/.pi/models.json" : "opencode.json"}，其余本地设置保持不变。</span></div>
        <div class="two">
          <div class="card assign"><h3>当前指向 <span class="muted" style="font-weight:400">· ${P.name}</span></h3>
            <div style="display:flex;flex-direction:column;gap:8px" role="radiogroup" aria-label="选择模型">${modelOptions(a, cur)}</div>
            <div class="savebar"><span id="dirty-${a}">${dirty.has(a) ? "有未保存的修改" : "已与 mgr 同步"}</span><button class="btn btn-ghost btn-sm" data-discard="${a}" ${dirty.has(a) ? "" : "disabled"}>放弃</button><button class="btn btn-primary" data-save="${a}" ${dirty.has(a) ? "" : "disabled"}>保存</button></div>
          </div>
          ${sandboxTable(a)}
        </div>`;
    });
    ["claude", "codex"].forEach((a) => {
      const blk = P[a];
      document.getElementById("tab-" + a).innerHTML = `
        <div class="strip">${I("info", "sm")}<span>切换式 agent：可保存多套预设，同一时刻只有一套「当前」生效并渲染进沙箱的 ${a === "claude" ? "~/.claude/settings.json" : "~/.codex/config.toml"}。</span></div>
        <div class="two">
          <div style="display:flex;flex-direction:column;gap:var(--space-4)">
            <div class="sec-head" style="margin:0"><div><h2 style="font-size:var(--text-base)">预设 <span class="muted" style="font-weight:400">(${blk.presets.length})</span></h2></div><div class="sec-acts"><button class="btn btn-primary btn-sm" data-newpreset="${a}">${I("plus")}新建预设</button></div></div>
            ${blk.presets.length ? blk.presets.map((p) => `<div class="card preset${p.id === blk.current ? " current" : ""}">
              <div class="preset-head"><h3>${p.name}</h3>${p.id === blk.current ? `<span class="badge badge-ok"><span class="dot"></span>当前</span>` : ""}</div>
              <div class="mono tsm">${PROVIDERS[p.provider] ? PROVIDERS[p.provider].name : p.provider} · ${p.model}</div>
              <dl class="kv">${Object.entries(p.extra).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
              <div class="preset-acts">${p.id === blk.current ? `<span class="txs muted" style="margin-right:auto">正在生效</span>` : `<button class="btn btn-secondary btn-sm" data-switch="${a}/${p.id}">切换为当前</button>`}<button class="icon-btn" title="复制" aria-label="复制预设 ${p.name}" data-dup="${a}/${p.id}">${I("copy", "sm")}</button><button class="icon-btn" title="编辑" aria-label="编辑预设 ${p.name}">${I("edit", "sm")}</button><button class="icon-btn danger" title="删除" aria-label="删除预设 ${p.name}" data-delp="${a}/${p.id}">${I("trash", "sm")}</button></div>
            </div>`).join("") : `<div class="card card-pad muted tsm" style="text-align:center;padding:var(--space-8)">该 profile 下还没有 ${AGENT_LABEL[a]} 预设。沙箱侧在没有「当前」预设时拒绝应用，保留本地配置。</div>`}
          </div>
          ${sandboxTable(a)}
        </div>`;
    });
  }
  document.addEventListener("change", (e) => {
    const P = PROFILES[profileId];
    if (e.target.name && e.target.name.startsWith("m-")) { const a = e.target.name.slice(2); const [pv, m] = e.target.value.split("/"); P[a] = { provider: pv, model: m }; dirty.add(a); renderAgents(); renderProviders(); }
    if (e.target.dataset.sb) { const s = SANDBOXES.find((x) => x.name === e.target.dataset.sb); const a = e.target.dataset.agent; if (e.target.checked) s.agents.push(a); else s.agents = s.agents.filter((x) => x !== a); dirty.add(a); renderAgents(); }
  });
  document.addEventListener("click", (e) => {
    const P = PROFILES[profileId]; const t = e.target.closest("[data-save],[data-discard],[data-switch],[data-dup],[data-delp],[data-newpreset],[data-goto]"); if (!t) return;
    if (t.dataset.save) { dirty.delete(t.dataset.save); renderAgents(); }
    else if (t.dataset.discard) { dirty.delete(t.dataset.discard); renderAgents(); }
    else if (t.dataset.switch) { const [a, id] = t.dataset.switch.split("/"); P[a].current = id; renderAgents(); renderProviders(); }
    else if (t.dataset.dup) { const [a, id] = t.dataset.dup.split("/"); const src = P[a].presets.find((p) => p.id === id); P[a].presets.push({ ...src, id: "p" + Date.now(), name: src.name + " 副本" }); renderAgents(); }
    else if (t.dataset.delp) { const [a, id] = t.dataset.delp.split("/"); if (!confirm("删除该预设？")) return; P[a].presets = P[a].presets.filter((p) => p.id !== id); if (P[a].current === id) P[a].current = P[a].presets[0]?.id ?? null; renderAgents(); renderProviders(); }
    else if (t.dataset.newpreset) { const a = t.dataset.newpreset; const n = prompt("预设名称：", a === "claude" ? "Anthropic 官方" : "OpenAI 官方"); if (!n) return; const pv = a === "claude" ? "anthropic" : "openai"; P[a].presets.push({ id: "p" + Date.now(), name: n, provider: pv, model: PROVIDERS[pv].models[0].id, extra: a === "claude" ? { "认证字段": "ANTHROPIC_API_KEY" } : { "推理强度": "medium", "wire API": "responses" } }); if (!P[a].current) P[a].current = P[a].presets[0].id; renderAgents(); }
    else if (t.dataset.goto) { profileId = t.dataset.goto; dirty.clear(); renderProfiles(); renderAgents(); }
  });

  renderProfiles(); renderProviders(); renderAgents();
})();
</script>
</body>
</html>
