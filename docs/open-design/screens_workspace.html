<!doctype html>
<html lang="zh-CN" data-mode="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AIO 沙箱 · 工作台</title>
<style>
/* Cloudflare Kumo UI — Open Design semantic bindings.
 * Official sources:
 * - https://kumo-ui.com/colors/
 * - https://github.com/cloudflare/kumo/tree/0c5832575c99988917b81cd752002e10f3dc9c7a
 * - packages/kumo/scripts/theme-generator/config.ts at that commit
 *
 * Upstream token values are adapted from @cloudflare/kumo 2.9.2,
 * Copyright (c) 2026 Cloudflare, Inc., licensed under the MIT License.
 * This is an Open Design curated integration, not an official Cloudflare package.
 */

:root {
  /* Kumo canvas, component base, and recessed surface. */
  --bg: oklch(98.75% 0 0);
  --surface: #ffffff;
  --surface-warm: oklch(96% 0 0);

  /* Kumo default and subtle text. B-slots collapse where Kumo has no matching tier. */
  --fg: oklch(21% 0.006 285.885);
  --fg-2: var(--fg);
  --muted: oklch(55.6% 0 0);
  --meta: var(--muted);

  /* Kumo line and hairline roles. */
  --border: oklch(14.5% 0 0 / 0.1);
  --border-soft: oklch(93.5% 0 0);

  /* Kumo brand background and its documented hover state. */
  --accent: oklch(0.5772 0.2324 260);
  --accent-on: #ffffff;
  --accent-hover: oklch(48.8% 0.243 264.376);
  --accent-active: var(--accent-hover);

  /* Kumo solid semantic indicators. */
  --success: oklch(59.6% 0.145 163.225);
  --warn: oklch(73.9% 0.177 58.2);
  --danger: oklch(63.7% 0.237 25.331);

  /* Inter is used by Kumo's official documentation and Figma resources. */
  --font-display: "Inter", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

  /* Kumo's compact 12/13/14/16 scale, extended with its inherited Tailwind heading steps. */
  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 30px;
  --text-4xl: 36px;
  --leading-body: 1.5;
  --leading-tight: 1.2;
  --tracking-display: 0;

  /* Open Design compatibility bindings aligned to Kumo's 4px utility rhythm. */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --section-y-desktop: 64px;
  --section-y-tablet: 48px;
  --section-y-phone: 32px;

  /* Kumo control radii map to Tailwind sm/md/lg; pills stay fully rounded. */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-pill: 9999px;

  /* Ring-led elevation mirrors Kumo LayerCard composition. */
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border);
  --elev-raised: 0 1px 2px 0 oklch(0% 0 0 / 0.08);
  --focus-ring: 0 0 0 2px oklch(15% 0 0);

  /* 150ms states/dialogs and the 250ms sidebar motion are upstream values. */
  --motion-fast: 150ms;
  --motion-base: 250ms;
  --ease-standard: cubic-bezier(0.77, 0, 0.175, 1);

  /* Open Design layout bindings preserve Kumo's compact dashboard density. */
  --container-max: 1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet: 16px;
  --container-gutter-phone: 12px;
}

/* Kumo uses data-mode="dark". The data-theme selector keeps generated Open
 * Design artifacts compatible with the repository's standard theme hook. */
[data-theme="dark"],
[data-mode="dark"] {
  --bg: oklch(10% 0 0);
  --surface: oklch(17% 0 0);
  --surface-warm: oklch(15% 0 0);
  --fg: oklch(97% 0 0);
  --fg-2: var(--fg);
  --muted: oklch(70.8% 0 0);
  --meta: var(--muted);
  --border: oklch(32% 0 0);
  --border-soft: oklch(26.9% 0 0);
  --accent: color-mix(in oklch, oklch(0.5772 0.2324 260), black 10%);
  --accent-on: #ffffff;
  --accent-hover: oklch(48.8% 0.243 264.376);
  --accent-active: var(--accent-hover);
  --success: oklch(76.5% 0.177 163.223);
  --warn: oklch(64.5% 0.168 50);
  --danger: oklch(57.7% 0.245 27.325);
  --elev-raised: 0 1px 2px 0 oklch(0% 0 0 / 0.3);
  --focus-ring: 0 0 0 2px oklch(93.5% 0 0);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-fast: 0ms;
    --motion-base: 0ms;
  }
}

/* ─── app shell ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-body);
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; }
input { font: inherit; }
.app { display: flex; height: 100vh; width: 100vw; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

:where(button, a, input, [tabindex]):focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
  border-radius: var(--radius-sm);
}

.icon { width: 16px; height: 16px; flex-shrink: 0; }
.icon-lg { width: 20px; height: 20px; flex-shrink: 0; }

/* ─── sidebar ───────────────────────────────────────────────────── */
.sidebar {
  width: 216px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface-warm);
  border-right: 1px solid var(--border-soft);
  transition: width var(--motion-base) var(--ease-standard);
}
.sidebar.collapsed { width: 52px; }

.sb-head {
  display: flex; align-items: center; gap: var(--space-1);
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3);
  min-height: 48px;
}
.sb-brand { display: flex; align-items: center; gap: var(--space-2); flex: 1; min-width: 0; }
.sb-brand .icon-lg { color: var(--fg); }
.sb-title { font-size: var(--text-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar.collapsed .sb-brand .sb-title { display: none; }
.sidebar.collapsed .sb-head { justify-content: center; padding-inline: 0; }

.icon-btn {
  width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent;
  color: var(--muted);
  border: 0; border-radius: var(--radius-md);
}
.icon-btn:hover { background: color-mix(in oklch, var(--fg) 7%, transparent); color: var(--fg); }
.icon-btn:active { color: var(--fg); }
.icon-btn:disabled { color: var(--muted); opacity: 0.55; cursor: default; }
.icon-btn:disabled:hover { background: transparent; }

.icon-btn.spin svg { animation: rot 0.9s linear infinite; animation-duration: max(0.9s, 2 * var(--motion-fast)); }
@keyframes rot { to { transform: rotate(360deg); } }

.sb-list { flex: 1; overflow-y: auto; padding: var(--space-2); display: flex; flex-direction: column; gap: var(--space-4); }

.sb-group-label {
  margin: 0 0 var(--space-1) var(--space-2);
  font-size: var(--text-xs);
  color: var(--muted);
  white-space: nowrap;
}
.sidebar.collapsed .sb-group-label { visibility: hidden; height: 0; margin: 0; }

.sb-row { display: flex; align-items: center; border-radius: var(--radius-md); }
.sb-row:hover { background: color-mix(in oklch, var(--fg) 7%, transparent); }

.launch-btn {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: var(--space-3);
  height: 36px; padding: 0 var(--space-2) 0 var(--space-2);
  background: transparent; color: var(--fg);
  border: 0; border-radius: var(--radius-md);
  font-size: var(--text-sm); text-align: left;
}
.launch-btn .icon { color: var(--muted); }
.launch-btn:hover .icon { color: var(--fg); }
.launch-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar.collapsed .launch-btn { justify-content: center; padding: 0; }
.sidebar.collapsed .launch-label { display: none; }

.del-btn {
  width: 26px; height: 26px; margin-right: var(--space-1);
  display: none; align-items: center; justify-content: center;
  background: transparent; color: var(--muted);
  border: 0; border-radius: var(--radius-sm);
}
.sb-row:hover .del-btn { display: inline-flex; }
.del-btn:hover { color: var(--danger); }
.del-btn .icon { width: 13px; height: 13px; }

.sb-foot { padding: var(--space-2); border-top: 1px solid var(--border-soft); }

.register-btn {
  width: 100%; height: 36px;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  background: var(--surface); color: var(--fg);
  border: 0; box-shadow: var(--elev-ring);
  border-radius: var(--radius-lg);
  font-size: var(--text-sm); font-weight: 500;
}
.register-btn:hover { background: color-mix(in oklch, var(--surface) 88%, var(--fg)); }
.register-btn:active { background: color-mix(in oklch, var(--surface) 80%, var(--fg)); }
.sidebar.collapsed .register-btn .btn-text { display: none; }
.sidebar.collapsed .register-btn { width: 36px; }

/* ─── tab bar ───────────────────────────────────────────────────── */
.tabbar {
  display: flex; align-items: stretch; gap: var(--space-1);
  min-height: 40px;
  padding: var(--space-1) var(--space-2) 0;
  background: var(--surface-warm);
  border-bottom: 1px solid var(--border-soft);
  overflow-x: auto; scrollbar-width: none;
}
.tab {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: 0 var(--space-2) 0 var(--space-3);
  background: transparent; color: var(--muted);
  border: 0; border-radius: var(--radius-md) var(--radius-md) 0 0;
  font-size: var(--text-sm); white-space: nowrap;
  position: relative;
}
.tab:hover { color: var(--fg); background: color-mix(in oklch, var(--fg) 5%, transparent); }
.tab[aria-selected="true"] { color: var(--fg); background: var(--surface); }
.tab[aria-selected="true"]::after {
  content: ""; position: absolute; left: var(--space-2); right: var(--space-2); bottom: 0;
  height: 2px; border-radius: var(--radius-pill); background: var(--accent);
}
.tab .icon { width: 13px; height: 13px; color: var(--muted); }
.tab[aria-selected="true"] .icon { color: var(--fg); }
.tab-close {
  width: 20px; height: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; color: var(--muted);
  border: 0; border-radius: var(--radius-sm);
}
.tab-close:hover { color: var(--danger); background: color-mix(in oklch, var(--danger) 12%, transparent); }
.tab-close .icon { width: 11px; height: 11px; }

/* ─── panes ─────────────────────────────────────────────────────── */
.pane-area { flex: 1; min-height: 0; position: relative; background: var(--bg); }
.pane { position: absolute; inset: 0; display: none; }
.pane.active { display: block; }

.pane-empty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3);
  color: var(--muted); text-align: center; padding: var(--space-6);
}
.pane-empty .icon-lg { width: 28px; height: 28px; color: var(--muted); }
.pane-empty h2 { margin: 0; font-size: var(--text-lg); font-weight: 600; color: var(--fg); }
.pane-empty p { margin: 0; font-size: var(--text-sm); max-width: 40ch; }

/* Terminal pane */
.term {
  height: 100%; overflow: auto;
  padding: var(--space-3);
  background: color-mix(in oklch, var(--bg) 88%, black);
  font-family: var(--font-mono);
  font-size: var(--text-base);
  line-height: 1.6;
}
.term-line { white-space: pre-wrap; word-break: break-all; }
.term-prompt { color: var(--success); }
.term-user { color: var(--fg); }
.term-path { color: var(--muted); }
.term-out { color: color-mix(in oklch, var(--fg) 78%, transparent); }
.term-dim { color: var(--muted); }
.term-cursor {
  display: inline-block; width: 8px; height: 15px; vertical-align: -2px;
  background: var(--fg);
  animation: blink 1.1s step-end infinite;
  animation-duration: max(1.1s, 4 * var(--motion-fast));
}
@keyframes blink { 50% { opacity: 0; } }

/* TUI pane (opencode) */
.tui { height: 100%; display: flex; flex-direction: column; background: color-mix(in oklch, var(--bg) 88%, black); }
.tui-head {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border-soft);
  font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted);
}
.tui-body { flex: 1; overflow: auto; padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-3); font-size: var(--text-sm); }
.tui-msg { max-width: 72ch; }
.tui-msg .who { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); margin-bottom: var(--space-1); }
.tui-msg .say { background: color-mix(in oklch, var(--surface) 70%, transparent); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); }
.tui-msg.you .say { background: color-mix(in oklch, var(--accent) 16%, transparent); border-color: color-mix(in oklch, var(--accent) 35%, transparent); }
.tui-input {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-top: 1px solid var(--border-soft);
  font-family: var(--font-mono); font-size: var(--text-sm); color: var(--muted);
}

/* Web-service pane (embedded iframe chrome mock) */
.webpane { height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.webchrome {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  background: var(--surface-warm);
  border-bottom: 1px solid var(--border-soft);
}
.webdots { display: flex; gap: 6px; }
.webdots span { width: 10px; height: 10px; border-radius: var(--radius-pill); background: color-mix(in oklch, var(--fg) 18%, transparent); }
.webaddr {
  flex: 1; display: flex; align-items: center; gap: var(--space-2);
  height: 26px; padding: 0 var(--space-3);
  background: var(--bg);
  border: 0; box-shadow: var(--elev-ring);
  border-radius: var(--radius-pill);
  font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted);
}
.webbody { flex: 1; min-height: 0; overflow: auto; }

/* code-server mock */
.cs { display: flex; height: 100%; font-size: var(--text-sm); }
.cs-activity {
  width: 44px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; gap: var(--space-1);
  padding-top: var(--space-2);
  background: var(--surface-warm); border-right: 1px solid var(--border-soft);
}
.cs-activity .icon-btn.active { color: var(--fg); position: relative; }
.cs-activity .icon-btn.active::before {
  content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 2px;
  background: var(--fg); border-radius: var(--radius-pill);
}
.cs-explorer {
  width: 208px; flex-shrink: 0;
  padding: var(--space-2);
  overflow-y: auto;
  border-right: 1px solid var(--border-soft);
}
.cs-explorer h3 {
  margin: 0 0 var(--space-2); padding: 0 var(--space-2);
  font-size: var(--text-xs); font-weight: 500; color: var(--muted);
  font-family: var(--font-mono); letter-spacing: 0.02em;
}
.cs-tree { list-style: none; margin: 0; padding: 0; }
.cs-tree li {
  display: flex; align-items: center; gap: var(--space-2);
  height: 26px; padding: 0 var(--space-2);
  border-radius: var(--radius-sm);
  color: var(--fg); white-space: nowrap; cursor: default;
}
.cs-tree li .icon { width: 14px; height: 14px; color: var(--muted); }
.cs-tree li.dimmed { color: var(--muted); }
.cs-tree li.selected { background: color-mix(in oklch, var(--fg) 8%, transparent); }
.cs-editor { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cs-tabs { display: flex; border-bottom: 1px solid var(--border-soft); background: var(--surface-warm); }
.cs-tab {
  display: inline-flex; align-items: center; gap: var(--space-2);
  height: 34px; padding: 0 var(--space-3);
  font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted);
  border-right: 1px solid var(--border-soft);
}
.cs-tab.active { color: var(--fg); background: var(--bg); box-shadow: inset 0 -2px 0 var(--fg); }
.cs-code {
  flex: 1; overflow: auto; padding: var(--space-3) 0;
  font-family: var(--font-mono); font-size: var(--text-sm); line-height: 1.7;
}
.cs-code .ln { display: flex; }
.cs-code .n { width: 44px; flex-shrink: 0; text-align: right; padding-right: var(--space-3); color: var(--muted); user-select: none; }
.cs-code .kw { color: color-mix(in oklch, var(--accent) 74%, var(--fg)); }
.cs-code .str { color: var(--success); }
.cs-code .cmt { color: var(--muted); }

/* VNC pane */
.vnc-shot { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }

/* ─── status bar ────────────────────────────────────────────────── */
.statusbar {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  min-height: 26px; padding: var(--space-1) var(--space-3);
  background: var(--surface-warm); border-top: 1px solid var(--border-soft);
  font-size: var(--text-xs); color: var(--muted);
  white-space: nowrap; overflow: hidden;
}
.statusbar .seg { display: inline-flex; align-items: center; gap: var(--space-2); overflow: hidden; text-overflow: ellipsis; }
.dot { width: 7px; height: 7px; border-radius: var(--radius-pill); background: var(--success); flex-shrink: 0; }
.statusbar .mono { font-family: var(--font-mono); font-size: 0.9em; }

/* ─── register dialog ───────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 40;
  display: none;
  align-items: center; justify-content: center;
  background: color-mix(in oklch, var(--bg) 72%, transparent);
  backdrop-filter: blur(2px);
}
.overlay.open { display: flex; }
.dialog {
  width: min(480px, calc(100vw - 32px));
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--elev-ring), var(--elev-raised), 0 12px 32px oklch(0% 0 0 / 0.35);
  padding: var(--space-5);
}
.dialog h2 { margin: 0 0 var(--space-1); font-size: var(--text-xl); font-weight: 600; line-height: var(--leading-tight); }
.dialog .sub { margin: 0 0 var(--space-4); font-size: var(--text-sm); color: var(--muted); }

.field { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-4); }
.field label { font-size: var(--text-sm); font-weight: 500; color: var(--fg); }
.field .hint { font-size: var(--text-xs); color: var(--muted); }
.field input {
  height: 36px; padding: 0 var(--space-3);
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  font-family: var(--font-mono); font-size: var(--text-sm);
}
.field input:hover { border-color: color-mix(in oklch, var(--border) 60%, var(--fg)); }
.field input:focus-visible { box-shadow: var(--focus-ring); }
.field input[aria-invalid="true"] { border-color: var(--danger); }
.field-error { font-size: var(--text-xs); color: var(--danger); display: none; }
.field-error.show { display: block; }

.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

.btn {
  height: 36px;
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  padding: 0 var(--space-4);
  border-radius: var(--radius-lg);
  border: 0; font-size: var(--text-sm); font-weight: 500;
}
.btn-secondary { background: var(--surface); color: var(--fg); box-shadow: var(--elev-ring); }
.btn-secondary:hover { background: color-mix(in oklch, var(--surface) 88%, var(--fg)); }
.btn-primary { background: var(--accent); color: var(--accent-on); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:active { background: var(--accent-active); }

/* ─── responsive guard ──────────────────────────────────────────── */
@media (max-width: 880px) {
  .sidebar { width: 52px; }
  .sidebar .sb-title, .sidebar .launch-label, .sidebar .sb-group-label { display: none; }
  .sidebar .launch-btn { justify-content: center; padding: 0; }
  .sidebar .register-btn { width: 36px; }
  .sidebar .register-btn .btn-text { display: none; }
  .sb-row .del-btn { display: inline-flex; }
  .cs-explorer { display: none; }
}
</style>
</head>

<svg style="display:none" aria-hidden="true">

  <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5"/><path d="m16 7 5 5-5 5"/></symbol>

<div class="app">
  <aside class="sidebar" id="sidebar" data-od-id="sidebar" aria-label="工具启动器">
    <div class="sb-head">
      <div class="sb-brand">
        <svg class="icon-lg" aria-hidden="true"><use href="#i-cube"/></svg>
        <span class="sb-title">AIO 沙箱</span>
      </div>
      <button class="icon-btn" id="refreshBtn" title="刷新服务清单" aria-label="刷新服务清单">
        <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
      </button>
      <button class="icon-btn" id="collapseBtn" title="折叠侧边栏" aria-label="折叠侧边栏" aria-expanded="true">
        <svg class="icon" aria-hidden="true"><use href="#i-chev-l"/></svg>
      </button>
    </div>

    <nav class="sb-list" id="sbList" aria-label="服务分组"></nav>

    <div class="sb-foot">
      <button class="register-btn" id="openRegister" data-od-id="register-button">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
        <span class="btn-text">注册按钮</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="tabbar" id="tabbar" role="tablist" aria-label="工作区标签页" data-od-id="tabbar"></div>
    <div class="pane-area" id="paneArea" data-od-id="pane-area">
      <div class="pane-empty" id="paneEmpty" hidden>
        <svg class="icon-lg" aria-hidden="true"><use href="#i-terminal"/></svg>
        <h2>所有标签页已关闭</h2>
        <p>从左侧选择一个工具，点击即可在此打开一个新实例。</p>
      </div>
    </div>
    <footer class="statusbar" data-od-id="statusbar">
      <span class="seg"><span class="dot" aria-hidden="true"></span><span id="sbLeft">3 个容器运行中 · gateway / app / code-server</span></span>
      <span class="seg"><span class="mono">localhost:8080</span><span>·</span><span>工作区卷已挂载</span></span>
    </footer>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" data-od-id="register-dialog">
    <h2 id="dlgTitle">注册自定义按钮</h2>
    <p class="sub">按钮会作为「终端 + 命令」运行在 app 容器中，并持久保存到工作区卷，重建容器后仍然可用。</p>
    <form id="registerForm" novalidate>
      <div class="field">
        <label for="fLabel">按钮名称</label>
        <input id="fLabel" name="label" maxlength="64" placeholder="例如：跟踪日志" autocomplete="off" />
        <span class="field-error" id="errLabel" role="alert">请填写按钮名称。</span>
      </div>
      <div class="field">
        <label for="fCmd">启动命令</label>
        <input id="fCmd" name="cmd" maxlength="64" placeholder="例如：make logs" autocomplete="off" />
        <span class="hint">在登录 shell 的 PATH 中执行；命令真实存在时按钮才会出现。</span>
        <span class="field-error" id="errCmd" role="alert">请填写启动命令。</span>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" id="cancelRegister">取消</button>
        <button type="submit" class="btn btn-primary" data-od-id="register-submit">添加按钮</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ── data ─────────────────────────────────────────────────────── */
  var SERVICES = [
    { id: "codeServer", label: "code-server", group: "web", icon: "i-code", kind: "web" },
    { id: "vnc", label: "VNC Chromium", group: "web", icon: "i-browser", kind: "web" },
    { id: "terminal", label: "终端", group: "tui", icon: "i-terminal", kind: "tui" },
    { id: "opencode", label: "opencode", group: "tui", icon: "i-chat", kind: "tui" }
  ];
  var CUSTOM = [{ id: "custom-logs", label: "跟踪日志", cmd: "make logs" }];

  var GROUPS = [
    { key: "web", label: "Web 工具" },
    { key: "tui", label: "终端与 Agent" },
    { key: "custom", label: "自定义" }
  ];

  var tabs = [];        /* { key, serviceId, kind, title } */
  var activeKey = null;
  var seq = {};
  var tabKeySeq = 0;
  var COLLAPSE_KEY = "aio.sidebar.collapsed";

  var $ = function (sel) { return document.querySelector(sel); };
  var sbList = $("#sbList");
  var tabbar = $("#tabbar");
  var paneArea = $("#paneArea");
  var paneEmpty = $("#paneEmpty");

  function serviceById(id) {
    for (var i = 0; i < SERVICES.length; i++) if (SERVICES[i].id === id) return SERVICES[i];
    for (var j = 0; j < CUSTOM.length; j++) if (CUSTOM[j].id === id) {
      var c = CUSTOM[j];
      return { id: c.id, label: c.label, group: "custom", icon: "i-terminal", kind: "tui", cmd: c.cmd };
    }
    return null;
  }

  /* ── sidebar ──────────────────────────────────────────────────── */
  function renderSidebar() {
    sbList.textContent = "";
    GROUPS.forEach(function (g) {
      var items;
      if (g.key === "custom") items = CUSTOM;
      else items = SERVICES.filter(function (s) { return s.group === g.key; });
      if (items.length === 0) return;

      var wrap = document.createElement("div");
      var label = document.createElement("p");
      label.className = "sb-group-label";
      label.textContent = g.label;
      wrap.appendChild(label);

      items.forEach(function (s) {
        var row = document.createElement("div");
        row.className = "sb-row";
        var btn = document.createElement("button");
        btn.className = "launch-btn";
        btn.title = s.label + " — 点击打开新实例";
        btn.setAttribute("aria-label", s.label + "，点击打开新实例");
        btn.innerHTML =
          '<svg class="icon" aria-hidden="true"><use href="#' + s.icon + '"/></svg>' +
          '<span class="launch-label"></span>';
        btn.querySelector(".launch-label").textContent = s.label;
        btn.addEventListener("click", function () { launch(s.id); });
        row.appendChild(btn);

        if (g.key === "custom") {
          var del = document.createElement("button");
          del.className = "del-btn";
          del.title = "移除 " + s.label;
          del.setAttribute("aria-label", "移除 " + s.label);
          del.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>';
          del.addEventListener("click", function () {
            CUSTOM.splice(CUSTOM.indexOf(s), 1);
            tabs.filter(function (t) { return t.serviceId === s.id; })
                .forEach(function (t) { closeTab(t.key, true); });
            renderSidebar(); renderTabs();
          });
          row.appendChild(del);
        }
        wrap.appendChild(row);
      });
      sbList.appendChild(wrap);
    });
  }

  /* ── tabs ─────────────────────────────────────────────────────── */
  function launch(serviceId) {
    var s = serviceById(serviceId);
    if (!s) return;
    seq[serviceId] = (seq[serviceId] || 0) + 1;
    var n = seq[serviceId];
    var tab = {
      key: "tab-" + (++tabKeySeq),
      serviceId: serviceId,
      kind: s.kind,
      title: n === 1 ? s.label : s.label + " (" + n + ")",
      icon: s.icon,
      cmd: s.cmd || null
    };
    tabs.push(tab);
    activeKey = tab.key;
    renderTabs();
  }

  function closeTab(key, silent) {
    var idx = tabs.findIndex(function (t) { return t.key === key; });
    if (idx === -1) return;
    var pane = document.getElementById("pane-" + key);
    if (pane) pane.remove();
    tabs.splice(idx, 1);
    if (activeKey === key) {
      activeKey = tabs[Math.min(idx, tabs.length - 1)]
        ? tabs[Math.min(idx, tabs.length - 1)].key
        : null;
    }
    if (!silent) renderTabs();
  }

  function renderTabs() {
    tabbar.textContent = "";
    tabs.forEach(function (t) {
      var b = document.createElement("button");
      b.className = "tab";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", t.key === activeKey ? "true" : "false");
      b.setAttribute("aria-controls", "pane-" + t.key);
      b.innerHTML =
        '<svg class="icon" aria-hidden="true"><use href="#' + t.icon + '"/></svg>' +
        '<span></span>' +
        '<span class="tab-close" role="button" tabindex="-1" aria-label="关闭 ' + t.title + '" title="关闭">' +
        '<svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></span>';
      b.querySelector("span:not(.tab-close)").textContent = t.title;
      b.addEventListener("click", function (e) {
        if (e.target.closest(".tab-close")) { closeTab(t.key); return; }
        activeKey = t.key;
        renderTabs();
      });
      tabbar.appendChild(b);
    });
    renderPanes();
  }

  function renderPanes() {
    Array.prototype.forEach.call(paneArea.querySelectorAll(".pane"), function (p) { p.remove(); });
    paneEmpty.hidden = tabs.length !== 0;
    tabs.forEach(function (t) {
      var pane = document.createElement("div");
      pane.className = "pane" + (t.key === activeKey ? " active" : "");
      pane.id = "pane-" + t.key;
      pane.setAttribute("role", "tabpanel");
      pane.appendChild(t.kind === "web" ? buildWebPane(t) : buildTermPane(t));
      paneArea.appendChild(pane);
    });
  }

  /* ── pane builders ────────────────────────────────────────────── */
  function termLine(html) {
    var d = document.createElement("div");
    d.className = "term-line";
    d.innerHTML = html;
    return d;
  }
  var PROMPT = '<span class="term-prompt">gem@aio</span><span class="term-dim">:</span><span class="term-path">~</span><span class="term-dim">$ </span>';

  function buildTermPane(t) {
    var term = document.createElement("div");
    term.className = "term";

    if (t.serviceId === "terminal") {
      term.appendChild(termLine(PROMPT + '<span class="term-user">docker compose ps</span>'));
      term.appendChild(termLine('<span class="term-out">NAME                IMAGE          STATUS            PORTS</span>'));
      term.appendChild(termLine('<span class="term-out">aio-gateway-1       caddy:2        Up 14 minutes     0.0.0.0:8080-&gt;80/tcp</span>'));
      term.appendChild(termLine('<span class="term-out">aio-app-1           sandbox-base   Up 14 minutes     </span>'));
      term.appendChild(termLine('<span class="term-out">aio-code-server-1   sandbox-base   Up 14 minutes     8081/tcp</span>'));
      term.appendChild(termLine(""));
      term.appendChild(termLine(PROMPT + '<span class="term-cursor" aria-hidden="true"></span>'));
    } else if (t.serviceId === "opencode") {
      var tui = document.createElement("div");
      tui.className = "tui";
      tui.innerHTML =
        '<div class="tui-head"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg><span>opencode · gem@aio · 会话 1</span></div>' +
        '<div class="tui-body">' +
        '  <div class="tui-msg you"><p class="who">你</p><div class="say">帮我把 web/src/Sidebar.tsx 里的按钮分组渲染拆成独立组件。</div></div>' +
        '  <div class="tui-msg"><p class="who">opencode</p><div class="say">已读取 Sidebar.tsx（138 行）。计划：抽出 GroupSection 组件，按 GROUPS 配置渲染，删除内联 map。先给出 diff 预览，确认后再写入。</div></div>' +
        '</div>' +
        '<div class="tui-input"><span>›</span><span>输入消息，Enter 发送</span></div>';
      return tui;
    } else {
      /* custom button: show the configured command as the launched line */
      var svc = serviceById(t.serviceId);
      term.appendChild(termLine('<span class="term-dim"># 自定义按钮 · ' + t.title + '</span>'));
      term.appendChild(termLine(PROMPT + '<span class="term-user">' + (svc && svc.cmd ? svc.cmd : "") + '</span>'));
      if (svc && svc.cmd === "make logs") {
        term.appendChild(termLine('<span class="term-out">docker compose logs -f --tail=50</span>'));
        term.appendChild(termLine('<span class="term-out">gateway-1   | {"level":"info","msg":"serving","addr":":80"}</span>'));
        term.appendChild(termLine('<span class="term-out">app-1       | pty ws attached: term/1 (bash)</span>'));
      }
      term.appendChild(termLine(""));
      term.appendChild(termLine(PROMPT + '<span class="term-cursor" aria-hidden="true"></span>'));
    }
    return term;
  }

  function buildWebPane(t) {
    var wrap = document.createElement("div");
    wrap.className = "webpane";
    var addr = t.serviceId === "codeServer" ? "code-server · 容器内服务" : "noVNC · 容器内服务";
    var chrome = document.createElement("div");
    chrome.className = "webchrome";
    chrome.innerHTML =
      '<div class="webdots" aria-hidden="true"><span></span><span></span><span></span></div>' +
      '<div class="webaddr"><svg class="icon" style="width:12px;height:12px" aria-hidden="true"><use href="#i-browser"/></svg><span>' + addr + '</span></div>';
    wrap.appendChild(chrome);

    var body = document.createElement("div");
    body.className = "webbody";
    if (t.serviceId === "codeServer") {
      body.innerHTML =
        '<div class="cs">' +
        '  <div class="cs-activity">' +
        '    <button class="icon-btn active" title="资源管理器" aria-label="资源管理器"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg></button>' +
        '    <button class="icon-btn" title="搜索" aria-label="搜索"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg></button>' +
        '    <button class="icon-btn" title="源代码管理" aria-label="源代码管理"><svg class="icon" aria-hidden="true"><use href="#i-git"/></svg></button>' +
        '    <button class="icon-btn" title="扩展" aria-label="扩展"><svg class="icon" aria-hidden="true"><use href="#i-puzzle"/></svg></button>' +
        '  </div>' +
        '  <div class="cs-explorer" aria-label="文件资源管理器">' +
        '    <h3>AIO-SANDBOX</h3>' +
        '    <ul class="cs-tree">' +
        '      <li><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg>Makefile</li>' +
        '      <li><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg>docker-compose.yml</li>' +
        '      <li><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>app</li>' +
        '      <li><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>gateway</li>' +
        '      <li><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>web</li>' +
        '      <li class="selected"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg>src/App.tsx</li>' +
        '      <li class="dimmed"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg>src/Sidebar.tsx</li>' +
        '      <li class="dimmed"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg>src/styles.css</li>' +
        '    </ul>' +
        '  </div>' +
        '  <div class="cs-editor">' +
        '    <div class="cs-tabs"><span class="cs-tab active">App.tsx</span><span class="cs-tab">Sidebar.tsx</span></div>' +
        '    <div class="cs-code">' +
        '      <div class="ln"><span class="n">46</span><span><span class="kw">type</span> Status = <span class="str">"loading"</span> | <span class="str">"error"</span> | <span class="str">"ready"</span>;</span></div>' +
        '      <div class="ln"><span class="n">47</span><span></span></div>' +
        '      <div class="ln"><span class="n">48</span><span><span class="kw">const</span> PANE_COMPONENT_TYPE = <span class="str">"aio-pane"</span>;</span></div>' +
        '      <div class="ln"><span class="n">49</span><span><span class="kw">const</span> TERMINAL_ID = <span class="str">"terminal"</span>;</span></div>' +
        '      <div class="ln"><span class="n">50</span><span></span></div>' +
        '      <div class="ln"><span class="n">51</span><span><span class="cmt">// Each click on a button creates a NEW instance (tab).</span></span></div>' +
        '      <div class="ln"><span class="n">52</span><span><span class="kw">export function</span> App(): JSX.Element {</span></div>' +
        '      <div class="ln"><span class="n">53</span><span>  <span class="kw">const</span> containerRef = useRef&lt;HTMLDivElement&gt;(<span class="kw">null</span>);</span></div>' +
        '      <div class="ln"><span class="n">54</span><span>  <span class="kw">const</span> glRef = useRef&lt;GoldenLayout | <span class="kw">null</span>&gt;(<span class="kw">null</span>);</span></div>' +
        '      <div class="ln"><span class="n">55</span><span>  <span class="cmt">// ...</span></span></div>' +
        '    </div>' +
        '  </div>' +
        '</div>';
    } else {
      var img = document.createElement("img");
      img.className = "vnc-shot";
      img.src = "../assets/vnc-screenshot.png";
      img.alt = "VNC 中运行的 Chromium 桌面（容器内服务截图）";
      body.appendChild(img);
    }
    wrap.appendChild(body);
    return wrap;
  }

  /* ── sidebar collapse ─────────────────────────────────────────── */
  var sidebar = $("#sidebar");
  var collapseBtn = $("#collapseBtn");

  function setCollapsed(collapsed) {
    sidebar.classList.toggle("collapsed", collapsed);
    collapseBtn.title = collapsed ? "展开侧边栏" : "折叠侧边栏";
    collapseBtn.setAttribute("aria-label", collapseBtn.title);
    collapseBtn.setAttribute("aria-expanded", collapsed ? "false" : "true");
    collapseBtn.querySelector("use").setAttribute("href", collapsed ? "#i-chev-r" : "#i-chev-l");
    try { localStorage.setItem(COLLAPSE_KEY, collapsed ? "1" : "0"); } catch (e) { /* 忽略 */ }
  }
  collapseBtn.addEventListener("click", function () {
    setCollapsed(!sidebar.classList.contains("collapsed"));
  });

  var stored = null;
  try { stored = localStorage.getItem(COLLAPSE_KEY); } catch (e) { /* 忽略 */ }
  setCollapsed(stored === "1");

  /* ── refresh ──────────────────────────────────────────────────── */
  var refreshBtn = $("#refreshBtn");
  refreshBtn.addEventListener("click", function () {
    if (refreshBtn.disabled) return;
    refreshBtn.disabled = true;
    refreshBtn.classList.add("spin");
    window.setTimeout(function () {
      refreshBtn.disabled = false;
      refreshBtn.classList.remove("spin");
      renderSidebar();
    }, 900);
  });

  /* ── register dialog ──────────────────────────────────────────── */
  var overlay = $("#overlay");
  var openRegister = $("#openRegister");
  var cancelBtn = $("#cancelRegister");
  var form = $("#registerForm");
  var fLabel = $("#fLabel");
  var fCmd = $("#fCmd");
  var errLabel = $("#errLabel");
  var errCmd = $("#errCmd");

  function openDialog() {
    overlay.classList.add("open");
    fLabel.value = ""; fCmd.value = "";
    setInvalid(fLabel, errLabel, false);
    setInvalid(fCmd, errCmd, false);
    fLabel.focus();
  }
  function closeDialog() {
    overlay.classList.remove("open");
    openRegister.focus();
  }
  function setInvalid(input, err, on) {
    input.setAttribute("aria-invalid", on ? "true" : "false");
    err.classList.toggle("show", on);
  }

  openRegister.addEventListener("click", openDialog);
  cancelBtn.addEventListener("click", closeDialog);
  overlay.addEventListener("pointerdown", function (e) {
    if (e.target === overlay) closeDialog();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && overlay.classList.contains("open")) closeDialog();
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var label = fLabel.value.trim();
    var cmd = fCmd.value.trim();
    var okL = !!label;
    var okC = !!cmd;
    setInvalid(fLabel, errLabel, !okL);
    setInvalid(fCmd, errCmd, !okC);
    if (!okL) { fLabel.focus(); return; }
    if (!okC) { fCmd.focus(); return; }
    CUSTOM.push({ id: "custom-" + Date.now(), label: label, cmd: cmd });
    renderSidebar();
    closeDialog();
  });

  /* ── boot ─────────────────────────────────────────────────────── */
  renderSidebar();
  launch("terminal");
  launch("codeServer");
})();
</script>
</body>
</html>
