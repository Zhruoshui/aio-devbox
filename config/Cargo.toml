[package]
name = "aio-config"
version = "0.1.0"
edition = "2021"
description = "AIO sandbox scenario configurator: Dockerfile.base generator"

# Build/host-side tool, not part of the running stack. Built into the
# `aio-config` image (see config/Dockerfile) and run via `docker run` from the
# Makefile (`make build-base`). Independent of the `app` crate.
# Library target: `gen` (Dockerfile.base assembly) + scenario/manifest
# discovery are reusable by other crates (the sandbox-mgr control plane
# reuses them for per-sandbox env assembly).
[lib]
name = "aio_config"
path = "src/lib.rs"

[[bin]]
name = "aio-config"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
