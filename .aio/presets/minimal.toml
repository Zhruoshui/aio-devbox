# Minimal preset: the always_on baseline (node + python, versioned selection
# pinned here) plus the default-on service-switch scenarios pi/pi-web
# (S1/D1: the mgr create-wizard service toggles are scenario UI upgrades,
# default all-on; repo CI builds with the defaults). CI copies this to
# .aio/enabled.toml to build the minimal variant. `scenarios = [...]` lists
# the non-always_on scenarios to bake; everything else (shell-utils/c23/mise/
# fonts) is minimal's cut.
scenarios = ["pi", "pi-web"]

